version: '3.8'

services:
  waguri:
    build: .
    container_name: secondbrain
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Mounting docker.sock agar Subagent Watchdog dapat memantau Docker Daemon host
      - /var/run/docker.sock:/var/run/docker.sock
      - wiki-content-data:/app/shared/wiki_content
      - waguri-media-data:/app/public/media
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta 
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MCP_SERVER_URL=http://mcp-sandbox:4000
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - waguri-internal
      - proxy-network

  mcp-sandbox:
    build: ./mcp-sandbox
    container_name: waguri-mcp-sandbox
    restart: always
    environment:
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TOOLS_GIT_REPO=${TOOLS_GIT_REPO:-}
      - GIT_BRANCH=${GIT_BRANCH:-main}
    volumes:
      - mcp-workspace:/workspace
      - waguri-media-data:/app/public/media
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    networks:
      - waguri-internal
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: waguri-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - waguri-internal

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: waguri-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - waguri-internal

networks:
  waguri-internal:
    driver: bridge
  proxy-network:
    external: true

volumes:
  mosquitto-data:
  wiki-content-data:
  mcp-workspace:
  waguri-media-data: